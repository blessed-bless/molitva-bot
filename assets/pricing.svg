  <text x="96" y="640" fill="#8F899C" font-family="Onest, sans-serif" font-size="18" font-weight="700">dubstepmolitva.ru · @ketasonx</text>
  <rect x="96" y="660" width="140" height="4" fill="#8B5CF6"/>
