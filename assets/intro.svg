<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: 'Unbounded';
        src: url('fonts/Unbounded-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: 'Onest';
        src: url('fonts/Onest-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
      }
    ]]></style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="#0D0B12"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- outer frame -->
  <rect x="36" y="36" width="1208" height="648" fill="none" stroke="#2A2438" stroke-width="1.5"/>
  <rect x="36" y="36" width="18" height="18" fill="#8B5CF6"/>
  <rect x="1226" y="666" width="18" height="18" fill="#8B5CF6"/>

  <!-- left accent bar -->
  <rect x="72" y="280" width="6" height="120" fill="#8B5CF6"/>

  <!-- title block -->
  <text x="96" y="250" fill="#F3F1EA" font-family="Unbounded, sans-serif" font-size="64" font-weight="700" letter-spacing="-0.04em">Молитва деплою</text>
  <text x="96" y="310" fill="#A78BFA" font-family="Onest, sans-serif" font-size="26" font-weight="700">Сайты · Telegram-боты · Онлайн-запись для бизнеса</text>

  <!-- footer -->
  <text x="96" y="640" fill="#8F899C" font-family="Onest, sans-serif" font-size="18" font-weight="700">dubstepmolitva.ru · @ketasonx</text>
  <rect x="96" y="660" width="140" height="4" fill="#8B5CF6"/>

  <!-- right: deploy timeline / log panel -->
  <g transform="translate(780, 160)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="420" height="400" rx="10" fill="#16131C" stroke="#2A2438" stroke-width="1.5"/>
    <text x="24" y="40" fill="#A78BFA" font-family="Onest, sans-serif" font-size="14" font-weight="700" opacity="0.85">deploy.log</text>
    <path d="M24 56 H396" stroke="#A78BFA" stroke-width="1" opacity="0.25"/>

    <!-- timeline rail -->
    <path d="M40 100 V340" stroke="#A78BFA" stroke-width="1.5" opacity="0.45"/>
    <circle cx="40" cy="120" r="5" fill="#8B5CF6"/>
    <circle cx="40" cy="190" r="5" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
    <circle cx="40" cy="260" r="5" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
    <circle cx="40" cy="330" r="5" fill="#8B5CF6"/>

    <text x="64" y="126" fill="#F3F1EA" font-family="Onest, sans-serif" font-size="16" font-weight="700">build · ok</text>
    <text x="64" y="148" fill="#8F899C" font-family="Onest, sans-serif" font-size="13" font-weight="700">12:04  npm run build</text>

    <text x="64" y="196" fill="#F3F1EA" font-family="Onest, sans-serif" font-size="16" font-weight="700">checks · passed</text>
    <text x="64" y="218" fill="#8F899C" font-family="Onest, sans-serif" font-size="13" font-weight="700">12:05  lint · types · smoke</text>

    <text x="64" y="266" fill="#F3F1EA" font-family="Onest, sans-serif" font-size="16" font-weight="700">ship · staging</text>
    <text x="64" y="288" fill="#8F899C" font-family="Onest, sans-serif" font-size="13" font-weight="700">12:07  rsync → edge</text>

    <text x="64" y="336" fill="#F3F1EA" font-family="Onest, sans-serif" font-size="16" font-weight="700">live · dubstepmolitva.ru</text>
    <text x="64" y="358" fill="#8F899C" font-family="Onest, sans-serif" font-size="13" font-weight="700">12:09  health 200</text>

    <!-- code ticks -->
    <g fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.35">
      <path d="M280 100 h90"/>
      <path d="M300 118 h70"/>
      <path d="M290 136 h80"/>
      <path d="M310 154 h60"/>
    </g>
  </g>
</svg>
